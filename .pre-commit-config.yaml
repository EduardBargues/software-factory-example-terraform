# The factory's first brake: deterministic IaC + security checks.
# The agent commits through these and must never use --no-verify, and must never
# edit this file or .github/ workflows (see docs/factory/SPEC.md).
#
# The terraform_* hooks shell out to the `terraform`, `tflint`, and `checkov`
# binaries, which CI installs via .github/actions/setup-iac-brakes. Locally, run
# `pre-commit autoupdate` periodically and keep the binaries current (RUNBOOK).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1 # verify/update via `pre-commit autoupdate`
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Lints GitHub Actions workflows — the factory's own machinery. Catches bad
  # ${{ }} expressions, unknown keys, deprecated actions, and shellchecks run: blocks.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
