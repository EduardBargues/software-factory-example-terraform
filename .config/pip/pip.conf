# Repo-local pip index: public PyPI (canonical host), no auth token.
# pip only reads this when PIP_CONFIG_FILE points at it (CI sets it; locally,
# export PIP_CONFIG_FILE=$PWD/.config/pip/pip.conf before reinstalling hooks).
# Keeps pre-commit hook installs off any token-gated private index.
[global]
index-url = https://pypi.org/simple
